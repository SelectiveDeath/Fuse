<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자 이미지 인식 딥러닝 모델 만들기(mnist)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #e0e0ff;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        .canvas-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        canvas {
            background: black;
            border: 3px solid #444;
            border-radius: 12px;
            cursor: crosshair;
            touch-action: none;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        #clearBtn {
            background: #444;
            color: white;
        }

        #clearBtn:hover { background: #666; }

        #predictBtn {
            background: #5865f2;
            color: white;
        }

        #predictBtn:hover { background: #4752c4; }

        .result-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 260px;
        }

        .prediction-box {
            background: #16213e;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            border: 2px solid #5865f2;
        }

        .prediction-label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
        }

        .prediction-number {
            font-size: 6rem;
            font-weight: bold;
            color: #5865f2;
            line-height: 1;
        }

        .confidence {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 8px;
        }

        .bars-box {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
        }

        .bars-title {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 12px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .bar-label {
            width: 16px;
            font-size: 0.85rem;
            color: #ccc;
        }

        .bar-track {
            flex: 1;
            background: #2a2a4a;
            border-radius: 4px;
            height: 14px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: #5865f2;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .bar-pct {
            width: 40px;
            font-size: 0.75rem;
            color: #aaa;
            text-align: right;
        }

        .loading {
            color: #888;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

<h1>✍️ 숫자 이미지 인식 딥러닝 모델 만들기</h1>
<p class="subtitle">정확도 96.88%</p>

<div class="container">
    <div class="canvas-section">
        <canvas id="canvas" width="280" height="280"></canvas>
        <div class="btn-row">
            <button id="clearBtn">지우기</button>
            <button id="predictBtn">예측하기</button>
        </div>
    </div>

    <div class="result-section">
        <div class="prediction-box">
            <div class="prediction-label">예측 숫자</div>
            <div class="prediction-number" id="predNum">?</div>
            <div class="confidence" id="predConf"></div>
        </div>

        <div class="bars-box">
            <div class="bars-title">각 숫자별 확률</div>
            <div id="bars">
                <div class="loading">예측하기 버튼을 눌러주세요</div>
            </div>
        </div>
    </div>
</div>

<script>
// ── 캔버스 그리기 ──────────────────────────────
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
let drawing   = false;

ctx.fillStyle = 'black';
ctx.fillRect(0, 0, 280, 280);
ctx.strokeStyle = 'white';
ctx.lineWidth   = 18;
ctx.lineCap     = 'round';
ctx.lineJoin    = 'round';

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top)  * scaleY
    };
}

canvas.addEventListener('mousedown',  e => { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
canvas.addEventListener('mousemove',  e => { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
canvas.addEventListener('mouseup',    () => drawing = false);
canvas.addEventListener('mouseleave', () => drawing = false);
canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
canvas.addEventListener('touchmove',  e => { e.preventDefault(); if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
canvas.addEventListener('touchend',   () => drawing = false);

document.getElementById('clearBtn').addEventListener('click', () => {
    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, 280, 280);
    document.getElementById('predNum').textContent  = '?';
    document.getElementById('predConf').textContent = '';
    document.getElementById('bars').innerHTML = '<div class="loading">예측하기 버튼을 눌러주세요</div>';
});

// ── 신경망 ─────────────────────────────────────
let weights = null;

fetch('weights.json')
    .then(r => r.json())
    .then(w => { weights = w; console.log('가중치 로드 완료!'); })
    .catch(e => console.error('가중치 로드 실패:', e));

function relu(x) {
    return x.map(v => Math.max(0, v));
}

function softmax(x) {
    const max   = Math.max(...x);
    const exps  = x.map(v => Math.exp(v - max));
    const sum   = exps.reduce((a, b) => a + b, 0);
    return exps.map(v => v / sum);
}

function matMul(X, W) {
    // X: [1, n], W: [n, m] → [1, m]
    const result = new Array(W[0].length).fill(0);
    for (let j = 0; j < W[0].length; j++) {
        for (let i = 0; i < X.length; i++) {
            result[j] += X[i] * W[i][j];
        }
    }
    return result;
}

function addBias(X, b) {
    return X.map((v, i) => v + b[0][i]);
}

function forward(input) {
    const { W1, b1, W2, b2, W3, b3 } = weights;
    const Z1 = addBias(matMul(input, W1), b1);
    const A1 = relu(Z1);
    const Z2 = addBias(matMul(A1, W2), b2);
    const A2 = relu(Z2);
    const Z3 = addBias(matMul(A2, W3), b3);
    const A3 = softmax(Z3);
    return A3;
}

// ── 이미지 전처리 ───────────────────────────────
function getInput() {
    // 280x280 → 28x28 으로 축소
    const offscreen = document.createElement('canvas');
    offscreen.width  = 28;
    offscreen.height = 28;
    const octx = offscreen.getContext('2d');
    octx.drawImage(canvas, 0, 0, 28, 28);

    const imageData = octx.getImageData(0, 0, 28, 28);
    const pixels    = [];

    for (let i = 0; i < imageData.data.length; i += 4) {
        // RGB 평균 → 정규화
        const gray = (imageData.data[i] + imageData.data[i+1] + imageData.data[i+2]) / 3;
        pixels.push(gray / 255.0);
    }
    return pixels;
}

// ── 예측 ────────────────────────────────────────
document.getElementById('predictBtn').addEventListener('click', () => {
    if (!weights) { alert('가중치 로딩 중...'); return; }

    const input  = getInput();
    const probs  = forward(input);
    const predIdx = probs.indexOf(Math.max(...probs));

    // 결과 표시
    document.getElementById('predNum').textContent  = predIdx;
    document.getElementById('predConf').textContent = `확률 ${(probs[predIdx]*100).toFixed(1)}%`;

    // 막대그래프
    const barsDiv = document.getElementById('bars');
    barsDiv.innerHTML = '';
    probs.forEach((p, i) => {
        const pct = (p * 100).toFixed(1);
        const row = document.createElement('div');
        row.className = 'bar-row';
        row.innerHTML = `
            <span class="bar-label">${i}</span>
            <div class="bar-track">
                <div class="bar-fill" style="width:${pct}%; ${i === predIdx ? 'background:#7289da' : ''}"></div>
            </div>
            <span class="bar-pct">${pct}%</span>
        `;
        barsDiv.appendChild(row);
    });
});
</script>
</body>
</html>
